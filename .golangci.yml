# golangci-lint — Go kod sifati va xavfsizlik.
#
# ChustApp'dagi (`F:\ChustApp\.golangci.yml`) bilan bir xil tanlov
# mantig'i: faqat HAQIQIY xato yoki xavfni topadigan linterlar
# yoqilgan. Istisno qo'shish qoidasi: har birida NEGA ekani yoziladi.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    # ── Xatolar ──
    - govet          # shubhali konstruksiyalar (printf argumentlari, nusxalangan mutex)
    - staticcheck    # bug'lar, eskirgan API, keraksiz kod
    - errcheck       # tekshirilmagan xatolar
    - ineffassign    # hech qachon o'qilmaydigan qiymat
    - unused         # ishlatilmaydigan kod
    - nilerr         # xato bor, lekin nil qaytarilyapti
    - bodyclose      # HTTP javob tanasi yopilmagan (ulanish oqishi)
    - rowserrcheck   # sql rows.Err() tekshirilmagan
    - sqlclosecheck  # sql.Rows/Stmt yopilmagan
    - copyloopvar    # sikl o'zgaruvchisini keraksiz nusxalash
    # ── Xavfsizlik ──
    - gosec          # SQL/buyruq in'ektsiyasi, zaif kripto, fayl yo'li, TLS
    - depguard       # taqiqlangan (xavfli) paketlar import qilinmasin
    # ── Sifat (murakkablik va takror) ──
    - gocognit       # tushunish qiyin funksiyalar
    - dupl           # nusxa ko'chirilgan kod bloklari

  settings:
    depguard:
      rules:
        insecure:
          list-mode: lax
          deny:
            - pkg: golang.org/x/crypto/openpgp
              desc: "qo'llab-quvvatlanmaydi va xavfli; kerak bo'lsa github.com/ProtonMail/go-crypto/openpgp"
    errcheck:
      # `defer x.Close()` va log yozuvchilarning xatosi amalda ishlanmaydi.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
    gocognit:
      min-complexity: 40
    dupl:
      threshold: 200
    gosec:
      excludes:
        # G104 — errcheck bilan bir xil (ikki marta xabar bermasin).
        - G104
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # ST1005 — "xato matni kichik harf bilan boshlansin". Bu loyihada
        # xato matnlari foydalanuvchiga ko'rinadigan o'zbekcha gap.
        - "-ST1005"
        # QF1001 — De Morgan qonuni bo'yicha qayta yozish taklifi (uslub).
        - "-QF1001"

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      # `web/node_modules` ichida begona paketlarning Go kodi bor —
      # bu bizning kodimiz emas.
      - node_modules
    rules:
      # Testlarda soxta sirlar, murakkab jadval-testlar va takroriy
      # fikstura kodi — normal. Xato/bug linterlari testlarda ham ishlaydi.
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - gocognit
          - errcheck

      # `cmd/tilesupload`, `cmd/osmimport`, `cmd/geoimport`, `cmd/admin` —
      # admin o'z kompyuterida ishga tushiradigan CLI vositalar: fayl
      # yo'li va buyruq argumentlari OPERATORdan keladi, tarmoq
      # foydalanuvchisidan emas.
      - path: cmd/(tilesupload|osmimport|geoimport|admin|migrate)/
        linters:
          - gosec
        text: 'G(204|304)'
