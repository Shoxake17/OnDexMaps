<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnDexMap — dev</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<style>
  /* ⚠️ `color-scheme: light` ATAYLAB qat'iy.
     Ilgari bu yerda `light dark` turgan edi va oqibati og'ir bo'lgan:
     tizim QORONG'I rejimda bo'lsa brauzer standart matn rangini OQ
     qiladi, panel foni esa aniq `#fff` — natijada oq ustiga oq va
     interfeys butunlay ko'rinmay qolgan.

     Shu sabab pastda HAR BIR matnning rangi ANIQ berilgan. Meros
     qilib olingan rangga tayanmaymiz. */
  :root {
    color-scheme: light;
    --ink:#111418; --ink-2:#5b6472; --ink-3:#8892a0;
    --card:#ffffff; --line:#e3e6ea; --tint:#f4f5f7;
    --accent:#ea580c; --accent-ink:#7c2d12; --err:#b91c1c;
    --shadow:0 6px 24px rgba(15,20,30,.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; background:var(--tint); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #map { position:absolute; inset:0; }

  .panel {
    position:absolute; top:12px; left:12px; z-index:2; width:330px;
    max-width:calc(100vw - 24px);
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .panel h1 {
    margin:0; padding:12px 15px; font-size:13px; font-weight:600;
    letter-spacing:.02em; background:var(--ink); color:#fff;
  }
  .panel .body { padding:13px 15px; color:var(--ink); }

  input[type=search] {
    width:100%; padding:10px 12px; font-size:14px; font-family:inherit;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; outline:none;
  }
  input[type=search]::placeholder { color:var(--ink-3); }
  input[type=search]:focus { border-color:var(--accent); }

  ul { list-style:none; margin:10px 0 0; padding:0; max-height:42vh; overflow:auto; }
  li {
    padding:9px 11px; border-radius:9px; cursor:pointer; font-size:13px;
    color:var(--ink); border:1px solid transparent;
  }
  li:hover { background:var(--tint); border-color:var(--line); }
  .type { font-size:11px; color:var(--ink-2); margin-top:2px; }
  .via  { font-size:11px; color:var(--accent-ink); margin-top:2px; }
  .hint { margin-top:11px; font-size:12px; color:var(--ink-2); line-height:1.55; }
  .hint b { color:var(--ink); }
  code {
    background:var(--tint); color:var(--ink); border:1px solid var(--line);
    padding:1px 5px; border-radius:5px; font-size:11px;
  }

  #resolve {
    position:absolute; bottom:12px; left:12px; z-index:2;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); padding:11px 15px;
    border-radius:14px; box-shadow:var(--shadow);
    font-size:13px; max-width:340px; line-height:1.5;
  }
  .err { color:var(--err); }

  /* Mapbox logotipi va atributsiya bloki — yashirilgan.
     `attributionControl: false` yozuvni o'chiradi, lekin LOGOTIP
     alohida element va u baribir chiqadi — shu sabab CSS ham kerak.

     ESLATMA: bu fayl `go:embed` orqali binarga KOMPILYATSIYA
     qilinadi. O'zgarish ko'rinishi uchun serverni qayta ishga
     tushirish SHART — brauzerni yangilash yetarli emas. */
  .mapboxgl-ctrl-logo,
  .mapboxgl-ctrl-attrib,
  .mapboxgl-ctrl-attrib-inner,
  .mapboxgl-ctrl-bottom-left,
  .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib,
  a.mapboxgl-ctrl-logo { display: none !important; }

  /* 2D / 3D almashtirgich */
  #dim {
    position:absolute; right:12px; bottom:12px; z-index:2;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:9px 15px;
    font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:var(--shadow); font-family:inherit;
  }
  #dim:hover { background:var(--tint); border-color:var(--accent); }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>OnDexMap — ishlab chiqish rejimi</h1>
  <div class="body">
    <input type="search" id="q" placeholder="Ko'cha yoki mahalla… (кирилча ham)" autocomplete="off">
    <ul id="results"></ul>
    <div class="hint">
      Xaritani bosing — <code>/v1/resolve</code> chaqiriladi.<br>
      Sinang: <b>навоий</b>, <b>katta kocha</b>, <b>amir</b>
    </div>
  </div>
</div>

<div id="resolve">Xaritani bosing…</div>
<button id="dim">2D</button>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const resolveBox = $('resolve');

  // Token frontend'ga YOZILMAGAN — serverdan olinadi (/v1/config).
  // Shu tufayli uni almashtirish uchun qayta build kerak emas.
  let token;
  try {
    const cfg = await (await fetch('/v1/config')).json();
    token = cfg.mapbox_token;
  } catch { /* pastda ushlanadi */ }

  if (!token) {
    resolveBox.innerHTML = '<span class="err">MAPBOX_TOKEN sozlanmagan (.env)</span>';
    return;
  }

  mapboxgl.accessToken = token;
  const map = new mapboxgl.Map({
    container: 'map',
    // `streets-v12` — Google Maps'ga eng yaqin ko'rinish: ko'chalar,
    // POI belgilar va 3D bino geometriyasi bor (`composite` manbasi).
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [71.2394, 41.0004],   // Chust
    zoom: 16,
    // Qiya ko'rinish — binolar bo'rtib turishi uchun. 0 bo'lsa
    // ekstruziya bor bo'lsa ham tekis ko'rinadi.
    pitch: 55,
    bearing: -17,
    antialias: true,   // ekstruziya qirralari tekis chiqishi uchun
    // Atributsiya o'chirilgan (loyiha egasining qarori).
    //
    // ESLATMA: Mapbox ToS standart tarifda atributsiyani talab
    // qiladi, OSM atributsiyasi esa ODbL talabi. Bu sahifa lokal
    // ishlab chiqish vositasi (prod'da ro'yxatdan o'tmaydi), lekin
    // OMMAVIY saytga chiqishdan oldin bu qaror qayta ko'rilishi
    // kerak — yoki Mapbox tarifi mos bo'lishi kerak.
    attributionControl: false,
  });
  // `visualizePitch` — kompas qiyalikni ham ko'rsatadi va sichqoncha
  // o'ng tugmasi bilan aylantirish mumkinligini bildiradi.
  map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');

  map.on('load', async () => {
    add3DBuildings();

    // ── Bizning mahalla poligonlarimiz ────────────────────────────
    const data = await (await fetch('/v1/mahallas')).json();
    map.addSource('ondex-mahallas', { type: 'geojson', data });

    // Mahalla qatlamlari binolardan PASTGA qo'yiladi — aks holda
    // to'q sariq to'ldirish binolarni yopib qo'yardi.
    const under = map.getLayer('ondex-3d-buildings') ? 'ondex-3d-buildings' : undefined;

    map.addLayer({
      id: 'mahalla-fill', type: 'fill', source: 'ondex-mahallas',
      paint: { 'fill-color': '#ea580c', 'fill-opacity': 0.10 }
    }, under);
    map.addLayer({
      id: 'mahalla-line', type: 'line', source: 'ondex-mahallas',
      paint: { 'line-color': '#ea580c', 'line-width': 2.5 }
    }, under);
    // Yorliq eng tepada — binolar orasida ham o'qilsin.
    map.addLayer({
      id: 'mahalla-label', type: 'symbol', source: 'ondex-mahallas',
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 13,
        'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular']
      },
      paint: { 'text-color': '#7c2d12', 'text-halo-color': '#fff', 'text-halo-width': 2 }
    });
  });

  // ── 3D binolar ────────────────────────────────────────────────────
  //
  // Mapbox uslubidagi `composite` manbasining `building` qatlamida
  // bino balandligi (`height`) bor, lekin u standart holatda TEKIS
  // chiziladi. `fill-extrusion` uni bo'rttiradi.
  //
  // Qatlam YORLIQLARDAN PASTGA qo'yiladi: aks holda binolar ko'cha
  // nomlarini yopib qo'yadi va xarita o'qilmay qoladi.
  function add3DBuildings() {
    const layers = map.getStyle().layers || [];
    const firstLabel = layers.find(
      (l) => l.type === 'symbol' && l.layout && l.layout['text-field']
    );

    // Uslub o'zgarsa `composite` manbasi bo'lmasligi mumkin —
    // o'shanda xarita 2D bo'lib ishlayveradi, yiqilmaydi.
    if (!map.getSource('composite')) return;

    map.addLayer({
      id: 'ondex-3d-buildings',
      source: 'composite',
      'source-layer': 'building',
      filter: ['==', 'extrude', 'true'],
      type: 'fill-extrusion',
      minzoom: 14,
      paint: {
        'fill-extrusion-color': [
          'interpolate', ['linear'], ['get', 'height'],
          0, '#e6e8ec',      // past binolar — och
          20, '#d3d7de',
          60, '#bcc2cc'      // baland binolar — to'qroq (hajm sezilsin)
        ],
        // Zoom 14 dan 15.5 gacha binolar "o'sib chiqadi" — keskin
        // paydo bo'lish o'rniga silliq o'tish.
        'fill-extrusion-height': [
          'interpolate', ['linear'], ['zoom'],
          14, 0, 15.5, ['get', 'height']
        ],
        'fill-extrusion-base': [
          'interpolate', ['linear'], ['zoom'],
          14, 0, 15.5, ['get', 'min_height']
        ],
        'fill-extrusion-opacity': 0.92,
      },
    }, firstLabel ? firstLabel.id : undefined);
  }

  // ── 2D / 3D almashtirgich ─────────────────────────────────────────
  $('dim').onclick = () => {
    const flat = map.getPitch() < 10;
    map.easeTo({ pitch: flat ? 55 : 0, bearing: flat ? -17 : 0, duration: 700 });
    $('dim').textContent = flat ? '2D' : '3D';
  };

  // ── Qidiruv ─────────────────────────────────────────────────────
  let timer;
  $('q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (q.length < 2) { $('results').innerHTML = ''; return; }
    // 250 ms debounce — har bosilgan harfda so'rov yubormaslik uchun
    // (server tomonda rate limit bor, uni bekorga sarflamaymiz).
    timer = setTimeout(() => search(q), 250);
  });

  async function search(q) {
    const res = await fetch('/v1/search?q=' + encodeURIComponent(q));
    if (!res.ok) {
      $('results').innerHTML = '<li class="err">' + (await res.json()).error + '</li>';
      return;
    }
    const { results } = await res.json();
    if (!results.length) { $('results').innerHTML = '<li class="type">topilmadi</li>'; return; }

    $('results').innerHTML = results.map((r) => {
      const via = r.matched_via ? '<div class="via">topildi: ' + esc(r.matched_via) + '</div>' : '';
      return '<li data-id="' + esc(r.id) + '">' + esc(r.name) +
             '<div class="type">' + r.type + ' · ' + r.score.toFixed(2) + '</div>' + via + '</li>';
    }).join('');
  }

  // ── Xaritani bosish → resolve ───────────────────────────────────
  map.on('click', async (e) => {
    const { lng, lat } = e.lngLat;
    resolveBox.textContent = 'so’ralmoqda…';
    const res = await fetch('/v1/resolve?lat=' + lat.toFixed(6) + '&lng=' + lng.toFixed(6));
    const body = await res.json();
    if (!res.ok) {
      resolveBox.innerHTML = '<span class="err">' + esc(body.error) + '</span>';
      return;
    }
    let html = '<b>' + esc(body.text) + '</b>';
    if (body.street_distance_m !== undefined) {
      html += '<br><span class="type">ko’chagacha ' + body.street_distance_m + ' m</span>';
    }
    resolveBox.innerHTML = html;
  });

  // Server matni HTML sifatida talqin qilinmasin — nomlar bazadan
  // keladi va kelajakda foydalanuvchi hissasi ham shu yerga tushadi.
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }
})();
</script>
</body>
</html>
