<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnDexMap — dev</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<!-- UMUMIY xarita uslublari: brend yashirish, asos xarita
     almashtirgichi, 2D/3D tugmasi. Admin muharriri ham AYNAN shu
     faylni yuklaydi (internal/mapui). -->
<link href="/assets/ondexmap.css" rel="stylesheet">
<style>
  /* ⚠️ `color-scheme: light` ATAYLAB qat'iy.
     Ilgari bu yerda `light dark` turgan edi va oqibati og'ir bo'lgan:
     tizim QORONG'I rejimda bo'lsa brauzer standart matn rangini OQ
     qiladi, panel foni esa aniq `#fff` — natijada oq ustiga oq va
     interfeys butunlay ko'rinmay qolgan.

     Shu sabab pastda HAR BIR matnning rangi ANIQ berilgan. Meros
     qilib olingan rangga tayanmaymiz. */
  :root {
    color-scheme: light;
    --ink:#111418; --ink-2:#5b6472; --ink-3:#8892a0;
    --card:#ffffff; --line:#e3e6ea; --tint:#f4f5f7;
    --accent:#ea580c; --accent-ink:#7c2d12; --err:#b91c1c;
    --shadow:0 6px 24px rgba(15,20,30,.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; background:var(--tint); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #map { position:absolute; inset:0; }

  .panel {
    position:absolute; top:12px; left:12px; z-index:2; width:330px;
    max-width:calc(100vw - 24px);
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .panel h1 {
    margin:0; padding:12px 15px; font-size:13px; font-weight:600;
    letter-spacing:.02em; background:var(--ink); color:#fff;
  }
  .panel .body { padding:13px 15px; color:var(--ink); }

  input[type=search] {
    width:100%; padding:10px 12px; font-size:14px; font-family:inherit;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; outline:none;
  }
  input[type=search]::placeholder { color:var(--ink-3); }
  input[type=search]:focus { border-color:var(--accent); }

  ul { list-style:none; margin:10px 0 0; padding:0; max-height:42vh; overflow:auto; }
  li {
    padding:9px 11px; border-radius:9px; cursor:pointer; font-size:13px;
    color:var(--ink); border:1px solid transparent;
  }
  li:hover { background:var(--tint); border-color:var(--line); }
  .type { font-size:11px; color:var(--ink-2); margin-top:2px; }
  .via  { font-size:11px; color:var(--accent-ink); margin-top:2px; }
  .hint { margin-top:11px; font-size:12px; color:var(--ink-2); line-height:1.55; }
  .hint b { color:var(--ink); }
  code {
    background:var(--tint); color:var(--ink); border:1px solid var(--line);
    padding:1px 5px; border-radius:5px; font-size:11px;
  }

  #resolve {
    position:absolute; bottom:12px; left:12px; z-index:2;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); padding:11px 15px;
    border-radius:14px; box-shadow:var(--shadow);
    font-size:13px; max-width:340px; line-height:1.5;
  }
  .err { color:var(--err); }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>OnDexMap — ishlab chiqish rejimi</h1>
  <div class="body">
    <input type="search" id="q" placeholder="Ko'cha yoki mahalla… (кирилча ham)" autocomplete="off">
    <ul id="results"></ul>
    <div class="hint">
      Xaritani bosing — <code>/v1/resolve</code> chaqiriladi.<br>
      Yuqori o'ngda <b>Xarita / Sputnik</b> almashtirgichi.
    </div>
  </div>
</div>

<div id="resolve">Xaritani bosing…</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<!-- UMUMIY xarita moduli — admin muharriri ham shu faylni yuklaydi. -->
<script src="/assets/ondexmap.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = OndexMap.esc;
  const resolveBox = $('resolve');

  // Token frontend'ga YOZILMAGAN — serverdan olinadi (/v1/config).
  // Shu tufayli uni almashtirish uchun qayta build kerak emas.
  let token;
  try {
    const cfg = await (await fetch('/v1/config')).json();
    token = cfg.mapbox_token;
  } catch { /* pastda ushlanadi */ }

  if (!token) {
    resolveBox.innerHTML = '<span class="err">MAPBOX_TOKEN sozlanmagan (.env)</span>';
    return;
  }

  const om = OndexMap.create({
    container: 'map',
    token,
    zoom: 16,
    pitch: 55,
    bearing: -17,
    // `onReady` uslub HAR SAFAR yuklanganda chaqiriladi — sputnikka
    // o'tilganda ham. Mapbox uslub almashtirilganda barcha
    // qo'shimcha qatlamlarni o'chiradi, shuning uchun ularni shu
    // yerda qayta qo'shamiz.
    onReady: (map, om) => addMahallaLayers(map, om),
  });
  const map = om.map;

  async function addMahallaLayers(map, om) {
    if (!map.getSource('ondex-mahallas')) {
      const data = await (await fetch('/v1/mahallas')).json();
      map.addSource('ondex-mahallas', { type: 'geojson', data });
    }
    if (map.getLayer('mahalla-fill')) return;

    // Binolardan PASTGA — aks holda to'ldirish ularni yopib qo'yadi.
    const under = om.beforeLayer();

    map.addLayer({
      id: 'mahalla-fill', type: 'fill', source: 'ondex-mahallas',
      paint: { 'fill-color': '#ea580c', 'fill-opacity': 0.10 }
    }, under);
    map.addLayer({
      id: 'mahalla-line', type: 'line', source: 'ondex-mahallas',
      paint: { 'line-color': '#ea580c', 'line-width': 2.5 }
    }, under);
    // Yorliq eng tepada — binolar orasida ham o'qilsin.
    map.addLayer({
      id: 'mahalla-label', type: 'symbol', source: 'ondex-mahallas',
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 13,
        'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular']
      },
      paint: { 'text-color': '#7c2d12', 'text-halo-color': '#fff', 'text-halo-width': 2 }
    });
  }

  // ── Qidiruv ─────────────────────────────────────────────────────
  let timer;
  $('q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (q.length < 2) { $('results').innerHTML = ''; return; }
    // 250 ms debounce — har bosilgan harfda so'rov yubormaslik uchun
    // (serverda rate limit bor, uni bekorga sarflamaymiz).
    timer = setTimeout(() => search(q), 250);
  });

  async function search(q) {
    const res = await fetch('/v1/search?q=' + encodeURIComponent(q));
    if (!res.ok) {
      $('results').innerHTML = '<li class="err">' + esc((await res.json()).error) + '</li>';
      return;
    }
    const { results } = await res.json();
    if (!results.length) { $('results').innerHTML = '<li class="type">topilmadi</li>'; return; }

    $('results').innerHTML = results.map((r) => {
      const via = r.matched_via ? '<div class="via">topildi: ' + esc(r.matched_via) + '</div>' : '';
      return '<li data-id="' + esc(r.id) + '">' + esc(r.name) +
             '<div class="type">' + esc(r.type) + ' · ' + r.score.toFixed(2) + '</div>' + via + '</li>';
    }).join('');
  }

  // ── Xaritani bosish → resolve ───────────────────────────────────
  map.on('click', async (e) => {
    const { lng, lat } = e.lngLat;
    resolveBox.textContent = 'so’ralmoqda…';
    const res = await fetch('/v1/resolve?lat=' + lat.toFixed(6) + '&lng=' + lng.toFixed(6));
    const body = await res.json();
    if (!res.ok) {
      resolveBox.innerHTML = '<span class="err">' + esc(body.error) + '</span>';
      return;
    }
    let html = '<b>' + esc(body.text) + '</b>';
    if (body.street_distance_m !== undefined) {
      html += '<br><span class="type">ko’chagacha ' + esc(body.street_distance_m) + ' m</span>';
    }
    resolveBox.innerHTML = html;
  });
})();
</script>
</body>
</html>
